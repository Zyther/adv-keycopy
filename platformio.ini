[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -I src -DUNITY_INCLUDE_DOUBLE
build_src_filter =
    +<key_formats.cpp>
    +<key_geometry.cpp>
    +<keycopy_io.cpp>
    +<view_math.cpp>
    +<model.cpp>
